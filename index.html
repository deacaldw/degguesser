<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DegGuesser</title>
  <meta name="description" content="How well do you know Celsius and Fahrenheit? Guess the temperature in the other unit. Weather, oven and permadeath modes.">
  <link rel="canonical" href="https://degguesser.deancaldwell.com/">
  <!-- sharing previews (Open Graph: iMessage, WhatsApp, Slack, Facebook, LinkedIn; Twitter/X card) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DegGuesser">
  <meta property="og:title" content="DegGuesser: guess the temperature">
  <meta property="og:description" content="How well do you know Celsius and Fahrenheit? Guess the temperature in the other unit.">
  <meta property="og:url" content="https://degguesser.deancaldwell.com/">
  <meta property="og:image" content="https://degguesser.deancaldwell.com/res/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="DegGuesser: What's 23 °C in °F? A thermometer with a draggable guess.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DegGuesser: guess the temperature">
  <meta name="twitter:description" content="How well do you know Celsius and Fahrenheit? Guess the temperature in the other unit.">
  <meta name="twitter:image" content="https://degguesser.deancaldwell.com/res/og-image.png">
  <link rel="icon" href="res/favicon.svg">
  <link rel="apple-touch-icon" href="res/icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DegGuesser">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151b27" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap">
  <link rel="stylesheet" href="res/deacald/deacald.css">
  <script defer src="res/deacald/deacald.js"></script>
  <script defer src="game.js"></script>
  <style>
    /* ==========================================================================
       Layout: a title bar, then the stage — the screen's content and the bottom
       bar, centred together. The thermometer canvas takes the height that's
       left, between --canvas-min and --canvas-max. Below its minimum the page
       scrolls, and the bottom bar sticks to the viewport as a separate bar.
       ========================================================================== */
    :root {
      --canvas-min: 280px;
      --canvas-max: 540px;
      --glass-edge: light-dark(color-mix(in srgb, #1d2433 35%, transparent), rgb(255 255 255 / .16));
      --channel:    light-dark(#f4f6f9, #262a33);
    }
    body { background: var(--card); }
    /* Permadeath tile: a lock-screen style wall of spooky emoji drifting diagonally behind its text */
    #mode-tile > :not(.tapestry) { position: relative; }
    .tapestry { --tile: 120px; position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .8s var(--ease-out); translate: none; }
    .tapestry::before { content: ""; position: absolute; inset: calc(-1 * var(--tile)) 0 0 calc(-1 * var(--tile)); background: var(--tapestry) 0 0 / var(--tile); animation: tapestry-drift 18s linear infinite; }
    @keyframes tapestry-drift { to { transform: translate(var(--tile), var(--tile)); } }
    .widget--night > .tapestry { opacity: .32; }
    @media (prefers-reduced-motion: reduce) { .tapestry::before { animation: none; } }
    .shell { display: flex; flex-direction: column; min-height: 100dvh; overflow-x: clip; }

    /* ---------- title bar ---------- */
    .titlebar { flex: none; }
    /* back | name (centred) | mode */
    .titlebar__inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; max-width: 560px; height: 56px; margin: 0 auto; padding: 0 16px; }
    .titlebar__name { grid-column: 2; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
    .titlebar .btn--icon { grid-column: 1; justify-self: start; margin-left: -4px; }
    .titlebar .chip { grid-column: 3; justify-self: end; }

    /* ---------- stage ---------- */
    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; width: 100%; max-width: 560px; margin: 0 auto; padding: 16px 16px 0; }
    .screen { display: contents; }
    .screen > * { animation: dc-rise .35s var(--ease-out) backwards; }

    /* ---------- bottom bar ----------
       In the flow, it's just the last row of the stage. Stuck to the viewport
       (the content runs under it), it becomes a separate bar. */
    .bottombar {
      position: sticky;
      bottom: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 76px;
      margin: 0 -16px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    /* the bar's own surface: full width, shown only while stuck */
    .bottombar::before {
      content: "";
      position: absolute;
      inset: 0 calc(50% - 50vw);
      z-index: -1;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      box-shadow: 0 -6px 16px -12px light-dark(rgb(15 23 42 / .25), rgb(0 0 0 / .8));
      opacity: 0;
      transition: opacity .25s;
    }
    .bottombar.is-stuck::before { opacity: 1; }
    .bottombar__info { display: grid; gap: 1px; line-height: 1.2; text-align: center; }
    .bottombar__label { font-size: .82rem; color: var(--ink-mute); }
    .bottombar__value { font-size: 1.15rem; font-weight: 600; }
    .bottombar .btn { min-width: 180px; }
    /* While playing, the bar sits over the bottom of the thermometer, its
       contents centred; it's hidden while you drag (Auto) */
    [data-screen="screen-play"] .stage { padding-bottom: 16px; }
    [data-screen="screen-play"] { --popup-lift: 84px; } /* achievement popups clear the bar */
    [data-screen="screen-play"] .bottombar { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; }
    [data-screen="screen-play"] .bottombar::before { inset: 0; opacity: 1; }
    .bottombar__label.is-bad { font-size: 1rem; font-weight: 700; color: var(--red); }
    /* the setup screen starts at the top */
    /* no top bar here, so keep the title clear of the status bar / notch area */
    [data-screen="screen-start"] .stage { justify-content: flex-start; padding-top: max(48px, calc(env(safe-area-inset-top) + 28px)); }
    [data-screen="screen-start"] .titlebar { display: none; }
    .sentinel { height: 1px; margin-top: -1px; }

    /* ---------- start ---------- */
    .screen-title { margin: 0; text-align: center; font-size: clamp(1.9rem, 7vw, 2.4rem); }
    /* tiles: square 1x1 tiles, as many to a row as fit; --wide spans the row */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .tiles .widget { aspect-ratio: 1; min-width: 0; }
    .tiles .widget--wide { aspect-ratio: auto; }
    .tiles--row { margin-top: 10px; }
    .tiles .widget--wide { grid-column: 1 / -1; }
    .tiles .widget:is([class*="--gold"], [class*="--red"]) { --tone-mix: 16%; }
    .tiles .widget__value small { font-size: .4em; color: var(--ink-soft); letter-spacing: 0; }
    .widget__value--none { color: var(--ink-faint); }
    .tile-body { display: grid; }
    #mode-tile { align-items: center; justify-content: center; gap: 2px; text-align: center; }
    .mode-tile__emoji { margin-bottom: 6px; font-size: 54px; line-height: 1; }
    .mode-tile__emoji .emoji { display: block; }
    #mode-tile .widget__title { font-size: 1.1rem; }
    #mode-tile .mode-tile__emoji { font-size: 44px; }
    /* a control that doesn't fit beside its label moves under it, to the right */
    .settings .list__row { flex-wrap: wrap; row-gap: 8px; min-height: 52px; padding-block: 8px; }
    .settings .list__label { flex: 1 0 auto; white-space: nowrap; }
    .settings .list__row > :last-child { margin-left: auto; }
    .settings .list > li + li > .list__row::before { left: 52px; }
    .list-footer .erase { min-height: 0; padding: 0; font-size: inherit; vertical-align: baseline; }

    /* ---------- play ---------- */
    .hud { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .hud__round { color: var(--ink-soft); }
    .hud__score { position: relative; display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .hud__score b { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    /* points won: a badge just left of "Score" that pops in, then fades away; it never moves the score */
    .hud__delta { position: absolute; right: calc(100% + 8px); top: 50%; margin-top: -13px; opacity: 0; pointer-events: none; }
    .hud__delta.is-shown { animation: delta-badge 2.2s var(--ease-out) forwards; }
    @keyframes delta-badge {
      0%   { opacity: 0; transform: scale(.5); }
      12%  { opacity: 1; transform: scale(1.12); }
      22%  { transform: scale(1); }
      80%  { opacity: 1; transform: none; }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    /* the time left: a bar that drains smoothly, the seconds in a pill on top */
    .countdown { position: relative; display: grid; place-items: center; height: 28px; }
    .countdown__track { position: absolute; inset: 9px 0; overflow: hidden; background: var(--track); border-radius: var(--r-pill); }
    .countdown__fill { height: 100%; background: var(--red); transform-origin: left; }
    .countdown__pill { position: relative; z-index: 1; min-width: 52px; padding: 3px 12px; font-size: .9rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-pill); box-shadow: var(--shadow); }
    .countdown.is-urgent .countdown__pill { color: #fff; background: var(--red); border-color: transparent; }
    .countdown.is-urgent .countdown__fill { animation: urgent .5s var(--ease-in-out) infinite alternate; }
    @keyframes urgent { to { opacity: .5; } }

    .question { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 12px; text-align: center; }
    .question__text { font-size: 1.6rem; font-weight: 300; letter-spacing: -.02em; color: var(--ink-soft); }
    .temp { padding: 6px 16px; font-size: 2.2rem; font-weight: 300; letter-spacing: -.03em; line-height: 1.1; white-space: nowrap; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); }
    .temp[class*="temp--"] { color: var(--tone-ink); background: var(--tone-tint); border-color: transparent; }

    /* the canvas: as tall as the space allows, between the limits */
    .canvas { position: relative; flex: 1 1 0; min-height: var(--canvas-min); max-height: var(--canvas-max); }
    .thermo { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; user-select: none; -webkit-user-select: none; cursor: ns-resize; }
    .thermo:focus { outline: none; }
    .thermo.is-revealed { cursor: default; }
    .note { position: absolute; left: 0; bottom: 6px; max-width: 34%; margin: 0; font-size: .86rem; color: var(--green-ink); }

    .glass   { fill: var(--card); stroke: var(--glass-edge); stroke-width: 1.2; stroke-linejoin: round; }
    .channel { fill: var(--channel); stroke: var(--line); stroke-width: 1; }
    .liquid  { stroke: color-mix(in srgb, var(--ink) 40%, transparent); stroke-width: 1; stroke-linejoin: round; }
    .liquid-glow { opacity: .45; }
    .tick       { stroke: var(--ink-soft); stroke-width: 1.1; stroke-linecap: round; }
    .tick.minor { stroke: var(--ink-faint); stroke-width: 1; }
    .tick-label { font-size: 13px; fill: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .unit-label { font-size: 12px; fill: var(--ink-soft); letter-spacing: .16em; }
    .scale-prompt { opacity: 0; transition: opacity .6s ease .35s; }
    .scale-prompt text { paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
    .thermo.is-revealed .scale-prompt { opacity: 1; }
    .knob, .feel { transition: opacity .2s; }
    .knob__glow { fill: var(--knob-fill); opacity: .5; }
    .knob__face { fill: var(--knob-fill); stroke: #fff; stroke-width: 3; filter: drop-shadow(0 1px 2px rgb(16 20 30 / .3)); }
    .knob path  { fill: none; stroke: var(--knob-mark); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .thermo.is-dragging .knob__glow { opacity: .8; }
    .thermo:focus-visible .knob__face { stroke: var(--blue-2); }
    .feel__bubble { fill: var(--card); stroke: color-mix(in srgb, var(--ink) 18%, transparent); stroke-width: 1; stroke-linejoin: round; }
    .feel__emoji { transform-box: fill-box; transform-origin: center; }
    .feel__emoji.pop { animation: feel-pop .35s var(--ease-bounce); }
    @keyframes feel-pop { from { transform: scale(.4); opacity: .3; } }
    .thermo.is-revealed :is(.knob, .feel) { opacity: 0; }
    /* "your guess" follows the handle; "actually" fades in at the reveal */
    .reveal-arrow--actual { opacity: 0; transition: opacity .3s ease .5s; }
    .thermo.is-revealed .reveal-arrow--actual { opacity: 1; }
    .reveal-arrow__tip   { fill: var(--ink); }
    .reveal-arrow__label { font-size: 13px; fill: var(--ink); }
    .reveal-arrow__num   { font-size: 21px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
    .reveal-arrow--actual .reveal-arrow__tip { fill: var(--green); }
    .reveal-arrow--actual text { fill: var(--green-ink); }

    /* ---------- final ---------- */
    .widget__note.is-bad { color: var(--red); font-weight: 600; }
    #final-title.is-bad { color: var(--red); font-weight: 700; }
    .final-best { align-self: start; margin-top: 6px; }
    /* chart tiles: large, the chart centred */
    .tiles .widget--chart { aspect-ratio: 1; }
    .target-chart { flex: 1; min-height: 0; width: 100%; margin: 4px auto 0; }
    .history__stats { display: flex; gap: 18px; }
    .history__stats .stat { justify-items: end; line-height: 1.1; }
    .history__stats .stat__value { font-size: 1.2rem; font-weight: 500; }
    .is-up { color: var(--green-ink); }
    .is-down { color: var(--red); }
    .history__empty { margin: 16px 0 8px; text-align: center; color: var(--ink-soft); }
    #history-chart { margin-top: 10px; }
    .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 14px 8px; margin-top: 14px; }
    .ach-item { position: relative; display: grid; justify-items: center; gap: 6px; text-align: center; }
    .ach-item__name { font-size: .78rem; font-weight: 500; line-height: 1.2; }
    .ach-item.is-locked .ach-item__name { color: var(--ink-faint); }
    /* achievement icons: one colour (green) instead of the tier colours, here and in popups */
    .ach-item .badge:not(.is-locked), .ach__icon { --tone: var(--green); --on-tone: var(--on-green); }
    .ach-item__new { position: absolute; top: -6px; left: calc(50% + 10px); height: 20px; padding: 0 7px; font-size: .68rem; }
  </style>
</head>
<body>
<div class="shell">
  <header class="glass-bar titlebar">
    <div class="titlebar__inner">
      <button class="btn btn--icon btn--ghost" id="back-btn" aria-label="Back to the start" hidden><svg class="icon"><use href="#i-back"/></svg></button>
      <span class="titlebar__name">DegGuesser</span>
      <span class="chip" id="mode-chip" hidden></span>
    </div>
  </header>

  <div class="stage">
    <!-- ===================================================== start -->
    <section class="screen" id="screen-start" hidden>
      <h1 class="screen-title">DegGuesser</h1>
      <div class="settings">
        <ul class="list">
          <li><div class="list__row">
            <span class="list__icon"><svg class="icon"><use href="#i-sparkle"/></svg></span>
            <span class="list__label">Mode</span>
            <div class="segmented segmented--sm" id="mode-pick" role="group" aria-label="Mode">
              <button value="weather">Weather</button><button value="oven">Oven</button><button value="permadeath">Permadeath</button>
            </div>
          </div></li>
          <li><div class="list__row">
            <span class="list__icon list__icon--green"><svg class="icon"><use href="#i-thermo"/></svg></span>
            <span class="list__label">Guess unit</span>
            <div class="segmented segmented--sm" id="unit-pick" role="group" aria-label="Guess unit">
              <button value="F">°F</button><button value="C">°C</button>
            </div>
          </div></li>
          <li id="submit-row"><div class="list__row">
            <span class="list__icon"><svg class="icon"><use href="#i-check"/></svg></span>
            <span class="list__label">Submit guess</span>
            <div class="segmented segmented--sm" id="submit-pick" role="group" aria-label="Submit guess">
              <button value="release">Auto</button><button value="button">Button</button>
            </div>
          </div></li>
          <li><label class="list__row">
            <span class="list__icon list__icon--green"><svg class="icon"><use href="#i-music"/></svg></span>
            <span class="list__label">Sound</span>
            <span class="switch"><input type="checkbox" id="sound-toggle" aria-label="Sound"><span class="switch__track"></span></span>
          </label></li>
          <li id="haptics-row" hidden><label class="list__row">
            <span class="list__icon list__icon--blue"><svg class="icon"><use href="#i-vibrate"/></svg></span>
            <span class="list__label">Haptics</span>
            <span class="switch"><input type="checkbox" id="haptics-toggle" aria-label="Haptics"><span class="switch__track"></span></span>
          </label></li>
        </ul>
        <p class="list-footer">Your game is saved in the browser. <button class="btn btn--plain btn--sm erase" id="erase-btn">Erase data</button></p>
      </div>
      <div class="tiles tiles--row">
        <article class="widget tilt" id="mode-tile">
          <div class="tapestry" id="tapestry" aria-hidden="true"></div>
          <span class="mode-tile__emoji" id="mode-tile-emoji"></span>
          <span class="widget__title" id="mode-tile-name"></span>
          <span class="widget__note" id="mode-tile-blurb"></span>
        </article>
        <article class="widget tilt">
          <div class="widget__label"><svg class="icon"><use href="#i-star"/></svg> High score</div>
          <div class="spacer"></div>
          <div class="tile-body" id="best-tile-body"></div>
          <span class="widget__note" id="best-tile-note"></span>
        </article>
        <article class="widget widget--green tilt">
          <div class="widget__label"><svg class="icon"><use href="#i-medal"/></svg> Achievements</div>
          <div class="spacer"></div>
          <span class="widget__value" id="ach-tile-count"></span>
          <div class="segbar segbar--thin" id="ach-tile-bar" data-segments="9" style="margin-top:10px"></div>
        </article>
      </div>
    </section>

    <!-- ===================================================== play -->
    <section class="screen" id="screen-play" hidden>
      <div class="hud">
        <span class="hud__round" id="round-label"></span>
        <span class="hud__score"><span class="muted">Score</span><b id="score">0</b><span class="chip hud__delta" id="score-delta"></span></span>
      </div>
      <div class="countdown" id="countdown" hidden>
        <div class="countdown__track"><div class="countdown__fill" id="countdown-fill"></div></div>
        <span class="countdown__pill" id="countdown-text"></span>
      </div>
      <div class="question">
        <span class="question__text">What's</span>
        <span class="temp" id="prompt-temp"></span>
        <span class="question__text" id="question"></span>
      </div>
      <div class="canvas">
        <svg class="thermo" id="thermo" tabindex="0" role="slider" aria-orientation="vertical" aria-label="Your guess"></svg>
        <p class="note" id="note" hidden></p>
      </div>
    </section>

    <!-- ===================================================== final -->
    <section class="screen" id="screen-final" hidden>
      <h1 class="screen-title">Results</h1>
      <div class="tiles">
        <article class="widget tilt" id="final-tile">
          <div class="widget__label"><svg class="icon"><use href="#i-flame"/></svg> <span id="final-title"></span></div>
          <div class="spacer"></div>
          <div class="widget__figure" id="final-score"></div>
          <span class="widget__note is-bad" id="final-note"></span>
          <span class="chip chip--gold final-best" id="final-best" hidden><svg class="icon"><use href="#i-star"/></svg> New best</span>
        </article>
        <article class="widget tilt">
          <div class="widget__label"><svg class="icon"><use href="#i-star"/></svg> High score</div>
          <div class="spacer"></div>
          <div class="tile-body" id="final-best-body"></div>
          <span class="widget__note" id="final-best-note"></span>
        </article>
        <article class="widget widget--wide widget--chart tilt">
          <div class="row row--between">
            <div class="widget__label"><svg class="icon"><use href="#i-check"/></svg> Accuracy</div>
            <span class="chip chip--blue" id="accuracy-pill"></span>
          </div>
          <svg class="target-chart" id="target-chart" aria-hidden="true"></svg>
        </article>
        <article class="widget widget--wide tilt">
          <div class="row row--between">
            <div class="widget__label"><svg class="icon"><use href="#i-clock"/></svg> Your last games</div>
            <div class="history__stats" id="history-stats">
              <div class="stat"><span class="stat__label">Change</span><span class="stat__value" id="history-change"></span></div>
              <div class="stat"><span class="stat__label">High score</span><span class="stat__value" id="history-best"></span></div>
            </div>
          </div>
          <svg class="lc" id="history-chart" aria-hidden="true"></svg>
          <p class="history__empty" id="history-empty">Play again to compare your scores over time.</p>
        </article>
        <article class="widget widget--wide widget--green tilt">
          <div class="row row--between">
            <div class="widget__label"><svg class="icon"><use href="#i-medal"/></svg> Achievements</div>
            <span class="widget__note" id="ach-count"></span>
          </div>
          <div class="ach-grid" id="ach-grid"></div>
        </article>
      </div>
    </section>

    <!-- ===================================================== bottom bar -->
    <footer class="bottombar" id="bottombar">
      <div class="bottombar__info" id="bar-info">
        <span class="bottombar__label" id="bar-label"></span>
        <span class="bottombar__value" id="bar-value"></span>
      </div>
      <button class="btn btn--primary btn--lg" id="go-btn"></button>
    </footer>
    <div class="sentinel" id="sentinel"></div>
  </div>
</div>
</body>
</html>
