<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#2447d8"/>
    </linearGradient>
    <radialGradient id="hg" cx=".3" cy="0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="merc" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff9a86"/>
      <stop offset=".55" stop-color="#ff4a3d"/>
      <stop offset="1" stop-color="#d81f1f"/>
    </radialGradient>
    <linearGradient id="col" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7a6a"/>
      <stop offset="1" stop-color="#e02a24"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0b1a5c" flood-opacity=".35"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#hg)"/>
    <!-- glass: the bulb in the middle, its tube running up out of the tile -->
    <g filter="url(#sh)" fill="#fff">
      <rect x="23" y="-12" width="18" height="50"/>
      <circle cx="32" cy="34" r="17"/>
    </g>
    <!-- mercury -->
    <rect x="28.5" y="-12" width="7" height="46" fill="url(#col)"/>
    <circle cx="32" cy="34" r="12" fill="url(#merc)"/>
    <ellipse cx="27.5" cy="29.5" rx="3.6" ry="2.4" fill="#fff" opacity=".55" transform="rotate(-35 27.5 29.5)"/>
  </g>
</svg>
